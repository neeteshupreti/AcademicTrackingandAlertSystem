{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAS | Login - Academic Tracking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }
        
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: #fff;
        }
        
        .login-header-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        
        .login-header-subtitle {
            font-size: 0.95rem;
            opacity: 0.95;
            margin: 0;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-group-login {
            margin-bottom: 1.5rem;
        }
        
        .form-label-login {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.95rem;
        }
        
        .form-input-login {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--gray-300);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .form-input-login:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        .form-input-login::placeholder {
            color: var(--gray-400);
        }
        
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .login-footer {
            text-align: center;
            padding: 0 2rem 1.5rem 2rem;
            color: var(--gray-500);
            font-size: 0.9rem;
        }
        
        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .error-message i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-header-title">
                    <i class="bi bi-graph-up"></i>
                    ATAS
                </div>
                <p class="login-header-subtitle">Academic Tracking & Alert System</p>
            </div>
            
            <div class="login-body">
                {% if form.non_field_errors %}
                    <div class="error-message">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <div>
                            {% for error in form.non_field_errors %}
                                <p style="margin: 0;">{{ error }}</p>
                            {% endfor %}
                        </div>
                    </div>
                {% endif %}
                
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="form-group-login">
                        <label for="username" class="form-label-login">
                            <i class="bi bi-person-fill me-2" style="color: #3b82f6;"></i>Username
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input-login" 
                            placeholder="Enter your username"
                            required
                            autofocus
                        >
                    </div>
                    
                    <div class="form-group-login">
                        <label for="password" class="form-label-login">
                            <i class="bi bi-lock-fill me-2" style="color: #3b82f6;"></i>Password
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input-login" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Sign In
                    </button>
                </form>
            </div>
            
            <div class="login-footer">
                <i class="bi bi-shield-check"></i> Secure login
            </div>
        </div>
    </div>
</body>
</html>
